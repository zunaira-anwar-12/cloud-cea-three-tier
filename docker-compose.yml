services:
  db:
    image: mysql:8.0
    network_mode: host
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/database_setup.sql:/docker-entrypoint-initdb.d/setup.sql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP
          --host=127.0.0.1 --port=3306
          --user="$$MYSQL_USER" --database="$$MYSQL_DATABASE"
          --execute="SELECT 1 FROM messages LIMIT 1"
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: ./app
    network_mode: host
    environment:
      DB_HOST: 127.0.0.1
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_VERSION: v1
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    network_mode: host
    environment:
      APP_HOST: 127.0.0.1
      APP_PORT: "80"
      WEB_PORT: "8080"
    depends_on:
      - app

volumes:
  db_data: