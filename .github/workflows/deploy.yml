name: CEA pipeline

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build, test, and publish three-tier app
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DB_NAME: hello_world
      DB_USER: cea_test
      DB_PASSWORD: local-ci-db-password
      MYSQL_ROOT_PASSWORD: local-ci-root-password

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and start test containers
        run: docker compose up -d --build

      - name: Verify app health and database read
        run: |
          set -euo pipefail

          curl -fsS --max-time 10 --retry 10 --retry-connrefused \
            http://127.0.0.1:80/api/health.php |
            jq -e '.status == "ok"'

          curl -fsS --max-time 10 --retry 10 --retry-connrefused \
            http://127.0.0.1:8080/api/get_messages.php |
            jq -e '.success == true and any(.messages[]; .message == "Hello from the database!")'

      - name: Push tested images to GHCR
        if: github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

          for service in web app; do
            container_id="$(docker compose ps -q "$service")"
            image_id="$(docker inspect --format '{{.Image}}' "$container_id")"
            target="ghcr.io/zunaira-anwar-12/cea-${service}:${GITHUB_SHA}"

            docker tag "$image_id" "$target"
            docker push "$target"
          done

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --tail=80

      - name: Clean up test containers and database volume
        if: always()
        run: docker compose down -v

  inspect-aws:
    name: Verify AWS deployment access
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Sign in to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::947930847498:role/cea-github-deploy-role
          aws-region: us-east-1

      - name: Check AWS identity and Auto Scaling groups
        run: |
          set -euo pipefail

          aws sts get-caller-identity
          aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names cea-app-asg cea-web-asg \
            --query 'AutoScalingGroups[].{Group:AutoScalingGroupName,Desired:DesiredCapacity,TemplateVersion:LaunchTemplate.Version}' \
            --output table